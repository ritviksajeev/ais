name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are here because the *host* running AiS need not be
        # Linux, even though the sandbox container always is. A module-scope
        # `import resource` once made the whole tool unimportable on Windows
        # before any backend was chosen; these jobs are what stops that
        # returning.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the AiS test suite
        # No Docker needed: the sandbox backends are stubbed or exercised
        # locally, so the whole suite runs on a plain runner.
        run: python -m pytest -q

      - name: Run the sample project's own suite
        working-directory: sample_project
        run: python -m pytest -q

      - name: Check the CLI starts
        # The reported bug was an ImportError three frames deep, before argument
        # parsing. --rules touches every import without needing a daemon.
        run: python demo.py --rules

      - name: Check the scenario payloads are in step with the template
        if: runner.os == 'Linux'
        run: |
          python scenarios/build_payloads.py
          git diff --exit-code scenarios/payloads \
            || (echo "::error::scenario payloads are stale - run scenarios/build_payloads.py" && exit 1)
